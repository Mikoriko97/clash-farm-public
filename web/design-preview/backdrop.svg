    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcf62"/><stop offset="1" stop-color="#5faa43"/></linearGradient>
    <radialGradient id="sun" cx="0.8" cy="0.18" r="0.35"><stop offset="0" stop-color="#fffbe0" stop-opacity="0.95"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
